<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Registro capacitación</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="background">
            <h1 id="header"> Register </h1>
            <form class="wrapper" id="register_form">      
                <label for="usuario">Elija usuario aquí:</label>
                <input id="user" name="usuario" placeholder="Usuario" type="text" required>
                <label for="password">Elija contraseña aquí:</label>
                <input id="password" name ="password" placeholder="Contraseña" type="password" required>
                <button type="submit" id="register_button" class="submit-button"> Regitrarse </button>
                <p>¿Ya tienes cuenta? 
                    <a href="index.html">Inicia sesión</a>
                </p>
            </form>
            <script src="app.js"> </script>
        </div>
    </body>
</html>
