<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Log in capacitación </title>
        <link ref="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Log in</h1>
            <hr>
        </header>
        <form action="/formulario" method="post">

            <br>

            <button type="submit"> Enviar </button>
        </form>
    </body>
</html>
