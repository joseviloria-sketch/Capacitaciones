<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Log in capacitación </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1 id="title">Log in</h1>
        <form class="login" action="/formulario" method="post">
            <div>
                <label for="usuario">Ingrese su email aquí:</label>
                <input id="usuario" name="usuario" placeholder="Usuario" type="text">
            </div>
            <div>
                <label for="password">Ingrese su contraseña aquí:</label>
                <input id="password" name ="password" placeholder="Contraseña" type="password">
            </div>
            <button type="submit"> Enviar </button>
        </form>
    </body>
</html>
