<!DOCTYPE html>
<html lang="en">
    <head>
        <title> Log in capacitación </title>
    </head>
    <body>
        <h1>Log in</h1>
        <p>A continuación ingrese su email y contraseña</p>
        <hr>
        <form action="/formulario" method="post">
            <label for="email">Ingrese su email aquí</label>
            <input id="email" name="email" placeholder="Ingrese su email" type="email">
            <br>
            <br>
            <label for="password">Ingrese su contraseña aquí</label>
            <input id="password" name ="password" placeholder="Contraseña" type="password">
            <br>
            <button type="submit"> Enviar </button>
        </form>
    </body>
</html>
